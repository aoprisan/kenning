name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc
      - run: node tests/smoke.mjs
      - run: node tests/render.mjs
      - name: dist is committed and current
        run: git diff --exit-code dist || (echo "dist/ is stale — run 'just build' and commit" && exit 1)
